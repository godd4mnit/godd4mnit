<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="godd4mnit terminal header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c2b"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2637" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.22"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- window chrome -->
    <rect width="1200" height="48" fill="#101725"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#232f45"/>
    <circle cx="32" cy="24" r="7" fill="#ff5f57"/>
    <circle cx="56" cy="24" r="7" fill="#febc2e"/>
    <circle cx="80" cy="24" r="7" fill="#28c840"/>
    <text x="600" y="30" text-anchor="middle" fill="#6d7d95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">~/godd4mnit — bash — 120x40</text>

    <!-- glitch wordmark -->
    <g font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-size="102" font-weight="900" text-anchor="middle">
      <g opacity="0.9">
        <text x="600" y="188" fill="#ff2e7e">GODD4MNIT</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;-8 2;6 -2;0 0;10 1;-4 0;0 0;0 0;0 0" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.9">
        <text x="600" y="188" fill="#00e7ff">GODD4MNIT</text>
        <animateTransform attributeName="transform" type="translate" values="0 0;8 -2;-6 2;0 0;-10 -1;4 0;0 0;0 0;0 0" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <text x="600" y="188" fill="#ffffff">GODD4MNIT</text>
    </g>

    <!-- prompt line -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21">
      <text x="600" y="243" text-anchor="middle" fill="#48d597">$ whoami</text>
      <text x="600" y="281" text-anchor="middle" fill="#d5deec">professional stack overflow copy-paste engineer</text>
      <text x="600" y="315" text-anchor="middle" fill="#6d7d95" font-size="16">every commit message is a cry for help</text>
    </g>
    <rect x="662" y="226" width="11" height="21" fill="#48d597">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="340" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#2c3a52" stroke-width="1"/>
</svg>
