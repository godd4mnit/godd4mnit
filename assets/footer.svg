<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="game over">
<defs><clipPath id="fc"><rect width="1200" height="230" rx="18"/></clipPath></defs>
<g clip-path="url(#fc)">
<rect width="1200" height="230" fill="#16213e"/>
<g stroke="#1e3a6b" stroke-width="2">
  <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200"/>
  <path d="M100 0 V230 M300 0 V230 M500 0 V230 M700 0 V230 M900 0 V230 M1100 0 V230"/>
</g>
<text x="600" y="92" text-anchor="middle" fill="#ff5252" font-family="'Arial Black',Impact,sans-serif" font-size="52" stroke="#000000" stroke-width="7" paint-order="stroke fill">GAME OVER</text>
<text x="600" y="140" text-anchor="middle" fill="#ffeb3b" font-family="'Arial Black',Impact,sans-serif" font-size="24">INSERT COIN TO CONTINUE
  <animate attributeName="opacity" values="1;1;0.15;1" dur="1.5s" repeatCount="indefinite"/></text>
<text x="600" y="180" text-anchor="middle" fill="#8fb4e8" font-family="'Arial Black',Impact,sans-serif" font-size="16">THANKS FOR PLAYING &#9670; STAR THE REPO &#9670; NEVER DEPLOY ON FRIDAY</text>
<g fill="#ffc107" stroke="#e65100" stroke-width="4">
  <ellipse cx="150" cy="150" rx="19" ry="24"><animate attributeName="rx" values="19;4;19" dur="1.2s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="1050" cy="150" rx="19" ry="24"><animate attributeName="rx" values="4;19;4" dur="1.2s" repeatCount="indefinite"/></ellipse>
</g>
</g></svg>