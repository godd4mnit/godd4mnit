<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c2b"/><stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <pattern id="fgrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b2434" stroke-width="1"/>
    </pattern>
    <clipPath id="fc"><rect width="1200" height="210" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#fc)">
    <rect width="1200" height="210" fill="url(#fbg)"/>
    <rect width="1200" height="210" fill="url(#fgrid)"/>
    <text x="600" y="80" text-anchor="middle" fill="#ffffff" font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-size="42">IT COMPILED. SHIP IT.</text>
    <text x="600" y="122" text-anchor="middle" fill="#ff2e7e" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19">no tests were harmed in the making of this repo</text>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#6d7d95">
      <text x="600" y="162" text-anchor="middle">star the repo <tspan fill="#48d597">/</tspan> steal the memes <tspan fill="#48d597">/</tspan> never deploy on friday</text>
      <text x="600" y="188" text-anchor="middle" fill="#4a5871">exit code 0 (somehow)</text>
    </g>
    <circle cx="70" cy="105" r="10" fill="#ff2e7e"><animate attributeName="r" values="7;14;7" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="105" r="10" fill="#00e7ff"><animate attributeName="r" values="14;7;14" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
