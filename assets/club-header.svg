<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#30105f"/>
      <stop offset="0.45" stop-color="#120528"/>
      <stop offset="1" stop-color="#030107"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="rainbow" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2bd6"><animate attributeName="stop-color" values="#ff2bd6;#00f6ff;#ffe94a;#ff2bd6" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#00f6ff"><animate attributeName="stop-color" values="#00f6ff;#ffe94a;#ff2bd6;#00f6ff" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ffe94a"><animate attributeName="stop-color" values="#ffe94a;#ff2bd6;#00f6ff;#ffe94a" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity=".22">
    <circle cx="110" cy="70" r="55" fill="#ff2bd6"><animate attributeName="r" values="45;70;45" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="80" r="62" fill="#00f6ff"><animate attributeName="r" values="70;45;70" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="300" r="45" fill="#ffe94a"><animate attributeName="opacity" values=".05;.35;.05" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="92" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="10">🪩 WELCOME TO 🪩</text>
  <text x="600" y="180" text-anchor="middle" fill="url(#rainbow)" filter="url(#glow)" font-family="Arial Black, Arial" font-size="76" font-weight="900" letter-spacing="4">DUNG.EXE</text>
  <text x="600" y="238" text-anchor="middle" fill="#ffffff" filter="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="12">DEV CLUB AFTER DARK</text>
  <text x="600" y="302" text-anchor="middle" fill="#ffddf8" font-family="monospace" font-size="20">● OPEN 24/7  •  NO SLEEP  •  MAXIMUM VIBES ●</text>
  <g fill="#fff">
    <circle cx="70" cy="300" r="3"><animate attributeName="opacity" values="0;1;0" dur=".9s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="270" r="4"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="140" r="2"><animate attributeName="opacity" values="0;1;0" dur=".7s" repeatCount="indefinite"/></circle>
  </g>
</svg>
